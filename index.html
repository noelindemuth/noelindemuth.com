a.link:hover{transform:translateY(-2px);border-color:var(--accent);background:#1c1f25}
a.link svg{width:20px;height:20px;flex:none;fill:currentColor}
a.link span{flex:1;text-align:center;margin-right:32px}
footer{margin-top:36px;color:#5d636b;font-size:.8rem}
